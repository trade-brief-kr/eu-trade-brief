<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="유럽 42개국의 통상·정책 보도와 주요 경제 통계를 한곳에서 확인하세요.">
  <title>유럽 통상 브리프</title>
  <link rel="stylesheet" href="assets/style.css?v=20261123092155">
  <link rel="stylesheet" href="assets/stats.css?v=20261123092155">
  <script defer src="data/report.js?v=20261123092155"></script>
  <script defer src="data/archive/index.js?v=20261123092155"></script>
  <script defer src="data/country-stats.js?v=20261123092155"></script>
  <script defer src="data/calendar.js?v=20261123092155"></script>
  <script defer src="assets/app.js?v=20261123092155"></script>
  <script defer src="assets/stats.js?v=20261123092155"></script>
  <script defer src="assets/calendar.js?v=20261123092155"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="site-header">
    <div class="container">
      <div class="heading">
        <div><p class="eyebrow">EUROPE TRADE &amp; POLICY DAILY</p><h1>유럽 통상 브리프</h1></div>
        <div class="dates"><strong id="report-date">보고서 불러오는 중</strong><p id="updated"></p></div>
      </div>
      <div class="controls">
        <label for="country">국가<select id="country"><option value="">전체</option></select></label>
        <button id="reset" type="button">초기화</button>
        <button id="copy" type="button" disabled>텍스트 복사</button>
      </div>
      <div class="archive-bar" id="archive-controls">
        <div class="day-nav">
          <button id="prev-day" type="button" disabled aria-label="이전 날짜 보고서">◀ 이전</button>
          <label class="sr-only" for="archive-date">보관본 날짜 선택</label>
          <select id="archive-date" disabled><option value="">최신 보고서</option></select>
          <button id="next-day" type="button" disabled aria-label="다음 날짜 보고서">다음 ▶</button>
        </div>
        <form id="search-form" role="search">
          <label class="sr-only" for="search">지난 보고서 키워드 검색</label>
          <input id="search" type="search" placeholder="지난 보고서 키워드 검색" aria-controls="search-results">
          <button type="submit">검색</button>
        </form>
      </div>
      <nav id="tabs" role="tablist" aria-label="콘텐츠">
        <button id="brief-tab" type="button" role="tab" aria-selected="true" aria-controls="brief">일일 브리프</button>
        <button id="country-tab" type="button" role="tab" aria-selected="false" aria-controls="country-info" tabindex="-1">국가 정보</button>
        <button id="calendar-tab" type="button" role="tab" aria-selected="false" aria-controls="calendar" tabindex="-1">주요 일정</button>
      </nav>
    </div>
  </header>
  <main class="container" id="main" tabindex="-1">
    <div id="archive-banner" class="archive-banner" hidden><span id="archive-banner-text"></span><button id="to-latest" type="button">최신 보고서로</button></div>
    <section id="search-results" class="card search-results" aria-label="지난 보고서 검색 결과" hidden></section>
    <section id="brief" role="tabpanel" aria-labelledby="brief-tab" tabindex="0" aria-busy="true"><p class="muted" role="status">보고서를 불러오고 있습니다.</p></section>
    <section id="country-info" role="tabpanel" aria-labelledby="country-tab" tabindex="0" aria-busy="true" hidden><p class="muted" role="status">국가 정보를 불러오고 있습니다.</p></section>
    <section id="calendar" role="tabpanel" aria-labelledby="calendar-tab" tabindex="0" aria-busy="true" hidden><p class="muted" role="status">주요 일정을 불러오고 있습니다.</p></section>
    <p id="status" role="status" aria-live="polite"></p>
    <noscript><p class="card">보고서와 국가 정보를 보려면 JavaScript를 켜 주세요.</p></noscript>
  </main>
  <footer class="site-footer container">공개 보도·공식 통계를 바탕으로 정리한 참고 자료입니다. 대상 국가: KOTRA 유럽지역 무역관 관할국(공개 관할지역표 기준).</footer>
</body>
</html>
